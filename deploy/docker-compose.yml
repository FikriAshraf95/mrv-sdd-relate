# Home hosting (SPEC-11 §7): `replay` writes, `public` serves the read-only snapshot, `cloudflared`
# (profile `tunnel`) publishes one hostname. Copy .env.example to .env first; see README.md.
name: relate-sdd

services:
  replay:
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    build:
      context: ..
      target: runtime
    image: ${IMAGE_PREFIX}/sdd:${IMAGE_TAG}
    command:
      - demo
      - replay
      - --sample
      - /app/samples/${SAMPLE}
      - --data
      - /data
    environment:
      SDD_REPLAY_TICK: ${SDD_REPLAY_TICK:-4}
      SDD_REPLAY_MAX_MIN: ${SDD_REPLAY_MAX_MIN:-20}
      SDD_REPLAY_SEED: ${SDD_REPLAY_SEED:-}
      TZ: ${TZ:-UTC}
    volumes:
      - demo-data:/data
    healthcheck:
      # the heartbeat file exists and is younger than 30 s (the replay has no HTTP server)
      test:
        - CMD
        - python
        - -c
        - "import os,sys,time; p='/data/run/.sdd/replay.heartbeat'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<30 else 1)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  public:
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    image: ${IMAGE_PREFIX}/sdd:${IMAGE_TAG}
    command:
      - public
      - --store
      - /data/run/.sdd/graph
      - --host
      - 0.0.0.0
      - --port
      - "8780"
    environment:
      SDD_ALLOW_REMOTE: "1"
      SDD_TRUSTED_PROXY_NET: ${COMPOSE_SUBNET}
      SDD_PUBLIC_QUERY: ${SDD_PUBLIC_QUERY:-guarded}
      # the guarded-query worker's memory cap (D006): it must fit in the 512 MB limit below
      # beside the server itself, so a runaway query kills the worker, never the server
      SDD_QUERY_MEMORY_MB: "384"
      SDD_PROJECT_NAME: ${SAMPLE}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      TZ: ${TZ:-UTC}
    volumes:
      - demo-data:/data:ro
    ports:
      - "${PUBLIC_BIND:-127.0.0.1}:${PUBLIC_PORT:-8780}:8780"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8780/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      replay:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION}
    profiles:
      - tunnel
    command:
      - tunnel
      - --no-autoupdate
      - run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET}

volumes:
  demo-data: {}
